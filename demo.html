<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GP 모의투자</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ── 네비게이션 ── */
    nav {
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3e;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { font-size: 20px; font-weight: 700; color: #4f8ef7; }
    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab {
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #888;
      border: none;
      background: none;
      transition: all 0.2s;
    }
    .nav-tab:hover { color: #e0e0e0; background: #2a2d3e; }
    .nav-tab.active { color: #4f8ef7; background: #1e2640; }
    .nav-user { font-size: 13px; color: #888; }
    .nav-user span { color: #4f8ef7; font-weight: 600; }

    /* ── 메인 레이아웃 ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* ── 섹션 ── */
    .section { display: none; }
    .section.active { display: block; }

    /* ── 카드 ── */
    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3e;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #c0c0c0;
      margin-bottom: 16px;
    }

    /* ── 그리드 ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 700px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* ── 폼 요소 ── */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #0f1117;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: #4f8ef7; }

    /* ── 버튼 ── */
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: #4f8ef7; color: #fff; }
    .btn-primary:hover { background: #3a7ee6; }
    .btn-success { background: #e53e3e; color: #fff; }
    .btn-success:hover { background: #c53030; }
    .btn-danger { background: #4299e1; color: #fff; }
    .btn-danger:hover { background: #3182ce; }
    .btn-outline {
      background: none;
      border: 1px solid #2a2d3e;
      color: #888;
    }
    .btn-outline:hover { border-color: #4f8ef7; color: #4f8ef7; }
    .btn-full { width: 100%; margin-top: 4px; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }

    /* ── 통계 박스 ── */
    .stat-box {
      background: #0f1117;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .stat-label { font-size: 11px; color: #666; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-value.up { color: #e53e3e; }
    .stat-value.down { color: #4299e1; }
    .stat-value.neutral { color: #e0e0e0; }

    /* ── 테이블 ── */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 10px 12px; color: #666; font-size: 12px; border-bottom: 1px solid #2a2d3e; }
    td { padding: 12px; border-bottom: 1px solid #1e2130; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1e2130; }

    /* ── 배지 ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-buy { background: #2d1e1e; color: #e53e3e; }
    .badge-sell { background: #1e2530; color: #4299e1; }

    /* ── 알림 ── */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .alert-success { background: #1a2e1a; border: 1px solid #276227; color: #68d391; }
    .alert-error { background: #2d1e1e; border: 1px solid #822727; color: #fc8181; }
    .alert-info { background: #1a2340; border: 1px solid #2c4a8c; color: #90cdf4; }

    /* ── 로그인 화면 ── */
    .login-wrap {
      max-width: 420px;
      margin: 80px auto 0;
    }
    .login-title { font-size: 28px; font-weight: 700; color: #4f8ef7; margin-bottom: 8px; }
    .login-sub { font-size: 14px; color: #666; margin-bottom: 32px; }
    .login-toggle { text-align: center; margin-top: 16px; font-size: 13px; color: #666; }
    .login-toggle a { color: #4f8ef7; cursor: pointer; text-decoration: none; }

    /* ── 주식 가격 색상 ── */
    .price-up { color: #e53e3e; }
    .price-down { color: #4299e1; }
    .price-neutral { color: #e0e0e0; }

    /* ── 순위 ── */
    .rank-num {
      font-size: 18px;
      font-weight: 700;
      color: #4f8ef7;
      width: 32px;
      text-align: center;
    }
    .rank-1 { color: #f6c90e; }
    .rank-2 { color: #aaa; }
    .rank-3 { color: #cd7f32; }

    /* ── 로딩 ── */
    .loading { text-align: center; padding: 40px; color: #555; }
    .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid #2a2d3e;
      border-top-color: #4f8ef7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 뉴스 ── */
    .news-item {
      padding: 14px 0;
      border-bottom: 1px solid #1e2130;
    }
    .news-item:last-child { border-bottom: none; }
    .news-title { font-size: 14px; color: #c0c0c0; margin-bottom: 4px; }
    .news-title a { color: inherit; text-decoration: none; }
    .news-title a:hover { color: #4f8ef7; }
    .news-meta { font-size: 12px; color: #555; }

    /* ── 빈 상태 ── */
    .empty { text-align: center; padding: 40px; color: #555; font-size: 14px; }
  </style>
</head>
<body>

<!-- 네비게이션 -->
<nav id="navbar" style="display:none">
  <div class="nav-logo">📈 GP 모의투자</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showSection('dashboard')">홈</button>
    <button class="nav-tab" onclick="showSection('stocks')">주식시세</button>
    <button class="nav-tab" onclick="showSection('trade')">매수/매도</button>
    <button class="nav-tab" onclick="showSection('portfolio')">포트폴리오</button>
    <button class="nav-tab" onclick="showSection('ranking')">랭킹</button>
    <button class="nav-tab" onclick="showSection('news')">뉴스</button>
    <button class="nav-tab" onclick="showSection('community')">커뮤니티</button>
  </div>
  <div class="nav-user">
    <span id="nav-username"></span>
    &nbsp;|&nbsp;
    <a href="#" onclick="logout()" style="color:#666;font-size:12px">로그아웃</a>
  </div>
</nav>

<!-- ====== 로그인/회원가입 섹션 ====== -->
<div id="auth-section">
  <div class="login-wrap">
    <!-- 로그인 -->
    <div id="login-form">
      <div class="login-title">GP 모의투자</div>
      <div class="login-sub">실전 같은 모의투자를 경험하세요</div>
      <div id="login-alert"></div>
      <div class="card">
        <div class="form-group">
          <label>아이디</label>
          <input id="login-id" type="text" placeholder="아이디 입력" />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input id="login-pw" type="password" placeholder="비밀번호 입력"
            onkeydown="if(event.key==='Enter') doLogin()" />
        </div>
        <button class="btn btn-primary btn-full" onclick="doLogin()">로그인</button>
      </div>
      <div class="login-toggle">
        계정이 없으신가요? <a onclick="toggleAuth('register')">회원가입</a>
      </div>
    </div>

    <!-- 회원가입 -->
    <div id="register-form" style="display:none">
      <div class="login-title">회원가입</div>
      <div class="login-sub">시작 자산 1,000만원이 지급됩니다</div>
      <div id="register-alert"></div>
      <div class="card">
        <div class="form-group">
          <label>아이디</label>
          <input id="reg-id" type="text" placeholder="아이디 입력" />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input id="reg-pw" type="password" placeholder="비밀번호 입력" />
        </div>
        <div class="form-group">
          <label>이름</label>
          <input id="reg-name" type="text" placeholder="이름 입력" />
        </div>
        <div class="form-group">
          <label>이메일</label>
          <input id="reg-email" type="email" placeholder="이메일 입력" />
        </div>
        <button class="btn btn-primary btn-full" onclick="doRegister()">회원가입</button>
      </div>
      <div class="login-toggle">
        이미 계정이 있으신가요? <a onclick="toggleAuth('login')">로그인</a>
      </div>
    </div>
  </div>
</div>

<!-- ====== 메인 앱 섹션 ====== -->
<div id="app-section" style="display:none">

  <!-- 홈 대시보드 -->
  <div id="section-dashboard" class="section active container">
    <div id="dashboard-alert"></div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">내 계좌 현황</div>
        <div class="grid-3">
          <div class="stat-box">
            <div class="stat-label">총 자산</div>
            <div class="stat-value neutral" id="d-balance">-</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">매수 가능 현금</div>
            <div class="stat-value neutral" id="d-cash">-</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">수익률</div>
            <div class="stat-value" id="d-profit">-</div>
          </div>
        </div>
        <br>
        <button class="btn btn-outline btn-sm" onclick="loadDashboard()">↻ 새로고침</button>
      </div>

      <div class="card">
        <div class="card-title">빠른 시세 조회</div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input id="quick-code" type="text" placeholder="종목코드 (예: 005930)"
            style="flex:1" onkeydown="if(event.key==='Enter') quickPrice()" />
          <button class="btn btn-primary btn-sm" onclick="quickPrice()">조회</button>
        </div>
        <div id="quick-result"></div>
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px">
          <button class="btn btn-outline btn-sm" onclick="setQuick('005930')">삼성전자</button>
          <button class="btn btn-outline btn-sm" onclick="setQuick('000660')">SK하이닉스</button>
          <button class="btn btn-outline btn-sm" onclick="setQuick('035420')">NAVER</button>
          <button class="btn btn-outline btn-sm" onclick="setQuick('035720')">카카오</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">보유 종목</div>
      <div id="d-holdings"></div>
    </div>
  </div>

  <!-- 주식 시세 -->
  <div id="section-stocks" class="section container">
    <div class="card">
      <div class="card-title">종목 검색</div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <input id="stock-search" type="text" placeholder="종목명 또는 코드 검색"
          style="flex:1" onkeydown="if(event.key==='Enter') searchStocks()" />
        <button class="btn btn-primary" onclick="searchStocks()">검색</button>
        <button class="btn btn-outline" onclick="searchStocks('')">전체</button>
      </div>
      <div id="stock-list"></div>
    </div>

    <div class="card" id="stock-detail-card" style="display:none">
      <div class="card-title" id="stock-detail-title">종목 상세</div>
      <div id="stock-detail"></div>
    </div>
  </div>

  <!-- 매수/매도 -->
  <div id="section-trade" class="section container">
    <div id="trade-alert"></div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title" style="color:#e53e3e">📈 매수 주문</div>
        <div class="form-group">
          <label>계좌 번호</label>
          <select id="buy-account"></select>
        </div>
        <div class="form-group">
          <label>종목 코드</label>
          <div style="display:flex;gap:8px">
            <input id="buy-code" type="text" placeholder="예: 005930" style="flex:1" />
            <button class="btn btn-outline btn-sm" onclick="fillBuyPrice()">현재가</button>
          </div>
        </div>
        <div class="form-group">
          <label>주문 단가 (원)</label>
          <input id="buy-price" type="number" placeholder="가격 입력" />
        </div>
        <div class="form-group">
          <label>수량 (주)</label>
          <input id="buy-qty" type="number" placeholder="수량 입력" min="1" />
        </div>
        <div id="buy-total" style="font-size:13px;color:#888;margin-bottom:12px"></div>
        <button class="btn btn-success btn-full" onclick="placeOrder('매수')">매수 주문</button>
      </div>

      <div class="card">
        <div class="card-title" style="color:#4299e1">📉 매도 주문</div>
        <div class="form-group">
          <label>계좌 번호</label>
          <select id="sell-account"></select>
        </div>
        <div class="form-group">
          <label>종목 코드</label>
          <div style="display:flex;gap:8px">
            <input id="sell-code" type="text" placeholder="예: 005930" style="flex:1" />
            <button class="btn btn-outline btn-sm" onclick="fillSellPrice()">현재가</button>
          </div>
        </div>
        <div class="form-group">
          <label>주문 단가 (원)</label>
          <input id="sell-price" type="number" placeholder="가격 입력" />
        </div>
        <div class="form-group">
          <label>수량 (주)</label>
          <input id="sell-qty" type="number" placeholder="수량 입력" min="1" />
        </div>
        <div id="sell-total" style="font-size:13px;color:#888;margin-bottom:12px"></div>
        <button class="btn btn-danger btn-full" onclick="placeOrder('매도')">매도 주문</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">주문 내역</div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <select id="order-account" style="width:180px"></select>
        <button class="btn btn-outline btn-sm" onclick="loadOrders()">조회</button>
      </div>
      <div id="order-list"></div>
    </div>
  </div>

  <!-- 포트폴리오 -->
  <div id="section-portfolio" class="section container">
    <div class="card">
      <div class="card-title">보유 종목 현황</div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <select id="portfolio-account" style="width:180px"></select>
        <button class="btn btn-outline btn-sm" onclick="loadPortfolio()">조회</button>
      </div>
      <div id="portfolio-list"></div>
    </div>
  </div>

  <!-- 랭킹 -->
  <div id="section-ranking" class="section container">
    <div class="card">
      <div class="card-title">🏆 수익률 랭킹</div>
      <div id="ranking-list"></div>
    </div>
  </div>

  <!-- 뉴스 -->
  <div id="section-news" class="section container">
    <div class="grid-2">
      <div class="card">
        <div class="card-title">📰 시장 뉴스</div>
        <div id="market-news"></div>
      </div>
      <div class="card">
        <div class="card-title">종목별 뉴스</div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input id="news-code" type="text" placeholder="종목코드" style="flex:1" />
          <button class="btn btn-outline btn-sm" onclick="loadSymbolNews()">조회</button>
        </div>
        <div id="symbol-news"></div>
      </div>
    </div>
  </div>

  <!-- 커뮤니티 -->
  <div id="section-community" class="section container">
    <div class="grid-2">
      <div class="card">
        <div class="card-title">💬 게시판</div>
        <div style="margin-bottom:12px">
          <button class="btn btn-primary btn-sm" onclick="toggleWriteForm()">✏ 글쓰기</button>
        </div>
        <div id="write-form" style="display:none;margin-bottom:16px">
          <div class="form-group">
            <label>제목</label>
            <input id="post-title" type="text" placeholder="제목 입력" />
          </div>
          <div class="form-group">
            <label>내용</label>
            <textarea id="post-content" rows="4"
              style="width:100%;padding:10px 14px;background:#0f1117;border:1px solid #2a2d3e;border-radius:8px;color:#e0e0e0;font-size:14px;resize:vertical;outline:none"
              placeholder="내용 입력"></textarea>
          </div>
          <button class="btn btn-primary btn-sm" onclick="submitPost()">등록</button>
          <button class="btn btn-outline btn-sm" onclick="toggleWriteForm()" style="margin-left:8px">취소</button>
        </div>
        <div id="post-list"></div>
      </div>

      <div class="card" id="post-detail-card" style="display:none">
        <div class="card-title" id="post-detail-title">게시글</div>
        <div id="post-detail"></div>
        <div style="margin-top:16px">
          <div style="display:flex;gap:8px">
            <input id="comment-input" type="text" placeholder="댓글 입력"
              style="flex:1" onkeydown="if(event.key==='Enter') submitComment()" />
            <button class="btn btn-primary btn-sm" onclick="submitComment()">등록</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const API = 'https://gp-mock-inv.onrender.com';
  let token = localStorage.getItem('gp_token') || '';
  let currentUser = JSON.parse(localStorage.getItem('gp_user') || 'null');
  let accounts = [];
  let currentPostId = null;

  /* ──────────────────── 유틸 ──────────────────── */
  const fmt = n => Number(n).toLocaleString('ko-KR') + '원';
  const fmtRate = r => {
    const v = parseFloat(r);
    const s = v >= 0 ? '+' : '';
    return `${s}${v.toFixed(2)}%`;
  };
  function colorClass(v) {
    return parseFloat(v) > 0 ? 'price-up' : parseFloat(v) < 0 ? 'price-down' : 'price-neutral';
  }

  async function api(method, path, body) {
    const opts = {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || '오류가 발생했습니다.');
    return data;
  }

  function showAlert(id, msg, type = 'error') {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    setTimeout(() => { el.innerHTML = ''; }, 4000);
  }

  /* ──────────────────── 화면 전환 ──────────────────── */
  function showSection(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('section-' + name).classList.add('active');
    const tabs = ['dashboard','stocks','trade','portfolio','ranking','news','community'];
    const idx = tabs.indexOf(name);
    document.querySelectorAll('.nav-tab')[idx].classList.add('active');

    if (name === 'dashboard') loadDashboard();
    if (name === 'stocks') searchStocks('');
    if (name === 'trade') loadAccountSelects();
    if (name === 'portfolio') loadPortfolioAccounts();
    if (name === 'ranking') loadRanking();
    if (name === 'news') { loadMarketNews(); }
    if (name === 'community') loadPosts();
  }

  /* ──────────────────── 현재가 일괄 조회 ──────────────────── */
  // 보유 종목 목록을 받아 각 종목의 현재가를 조회하고
  // { symbol_code: 현재가 } 형태의 Map을 반환합니다.
  async function fetchCurrentPrices(holdings) {
    const priceMap = {};
    await Promise.all(
      holdings.map(async h => {
        try {
          const d = await api('GET', `/api/stocks/${h.symbol_code}/price`);
          priceMap[h.symbol_code] = parseFloat(d.current_price);
        } catch(e) {
          // 현재가 조회 실패 시 평균단가로 대체 (수익률 0%로 표시)
          priceMap[h.symbol_code] = parseFloat(h.avg_price);
        }
      })
    );
    return priceMap;
  }

  /* ──────────────────── 대시보드 ──────────────────── */
  async function loadDashboard() {
    try {
      accounts = await api('GET', '/api/trading/accounts');
      if (!accounts.length) { document.getElementById('d-balance').textContent = '계좌 없음'; return; }
      const acc = accounts[0];
      document.getElementById('d-cash').textContent = fmt(acc.withdrawable_cash);
      loadHoldings(acc.account_id, acc.withdrawable_cash);
    } catch(e) { console.error(e); }
  }

  async function loadHoldings(accountId, cash) {
    const el = document.getElementById('d-holdings');
    try {
      const data = await api('GET', `/api/trading/portfolio?account_id=${accountId}`);

      if (!data.holdings.length) {
        // 보유 종목 없으면 현금 = 총 자산
        document.getElementById('d-balance').textContent = fmt(cash);
        const el2 = document.getElementById('d-profit');
        const profitRate = ((cash - 10000000) / 10000000 * 100).toFixed(2);
        el2.textContent = fmtRate(profitRate);
        el2.className = 'stat-value ' + (profitRate > 0 ? 'up' : profitRate < 0 ? 'down' : 'neutral');
        el.innerHTML = '<div class="empty">보유 종목이 없습니다.</div>';
        return;
      }

      // 보유 종목별 현재가 조회
      const priceMap = await fetchCurrentPrices(data.holdings);

      // 주식 평가금액 합산 (현재가 × 수량)
      let stockValue = 0;
      data.holdings.forEach(h => {
        stockValue += priceMap[h.symbol_code] * h.hold_quantity;
      });

      // 총 자산 = 현금 + 주식 평가금액
      const totalAsset = cash + stockValue;
      // 수익률 = (총 자산 - 시드머니) / 시드머니 × 100
      const profitRate = ((totalAsset - 10000000) / 10000000 * 100).toFixed(2);

      document.getElementById('d-balance').textContent = fmt(totalAsset);
      const profitEl = document.getElementById('d-profit');
      profitEl.textContent = fmtRate(profitRate);
      profitEl.className = 'stat-value ' + (profitRate > 0 ? 'up' : profitRate < 0 ? 'down' : 'neutral');

      // 보유 종목 테이블 (현재가·수익률 컬럼 추가)
      el.innerHTML = `
        <table>
          <thead><tr><th>종목코드</th><th>종목명</th><th>평균단가</th><th>현재가</th><th>수익률</th><th>수량</th><th>평가금액</th></tr></thead>
          <tbody>
            ${data.holdings.map(h => {
              const cur = priceMap[h.symbol_code];
              const rate = ((cur - h.avg_price) / h.avg_price * 100).toFixed(2);
              const cls = rate > 0 ? 'price-up' : rate < 0 ? 'price-down' : 'price-neutral';
              return `
              <tr>
                <td>${h.symbol_code}</td>
                <td>${h.security_name}</td>
                <td>${fmt(h.avg_price)}</td>
                <td class="${cls}">${fmt(cur)}</td>
                <td class="${cls}">${fmtRate(rate)}</td>
                <td>${h.hold_quantity}주</td>
                <td>${fmt(cur * h.hold_quantity)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    } catch(e) { el.innerHTML = '<div class="empty">불러오기 실패</div>'; }
  }

  function updateTotal(side) {
    const price = parseFloat(document.getElementById(side+'-price').value) || 0;
    const qty = parseInt(document.getElementById(side+'-qty').value) || 0;
    const total = price * qty;
    document.getElementById(side+'-total').textContent =
      total ? `주문 금액: ${fmt(total)}` : '';
  }
  document.addEventListener('input', e => {
    if (['buy-price','buy-qty'].includes(e.target.id)) updateTotal('buy');
    if (['sell-price','sell-qty'].includes(e.target.id)) updateTotal('sell');
  });

      if (data.holdings.length) {

          stockValue += priceMap[h.symbol_code] * h.hold_quantity;
        });
        totalAsset = cash + stockValue;
      }

      // 수익률 = (총 자산 - 시드머니) / 시드머니 × 100
      const profitRate = ((totalAsset - 10000000) / 10000000 * 100).toFixed(2);

      let html = `
        <div class="grid-3" style="margin-bottom:16px">
          <div class="stat-box"><div class="stat-label">총 자산</div><div class="stat-value neutral">${fmt(totalAsset)}</div></div>

        html += '<div class="empty">보유 종목이 없습니다.</div>';

        html += `

            <thead><tr><th>코드</th><th>종목명</th><th>평균단가</th><th>현재가</th><th>수익률</th><th>수량</th><th>평가금액</th></tr></thead>

                const cur = priceMap[h.symbol_code];

                </tr>`;
              }).join('')}

            <div style="padding:8px 0;border-bottom:1px solid #1e2130">
              <span style="font-size:12px;color:#4f8ef7">${c.author_name}</span>
              <span style="font-size:13px;color:#c0c0c0;margin-left:8px">${c.content}</span>
            </div>`).join('') : '<div style="color:#555;font-size:13px">댓글이 없습니다.</div>'}
        </div>`;
    } catch(e) { el.innerHTML = `<div class="alert alert-error">${e.message}</div>`; }
  }

  async function toggleLike(postId) {
    try {
      const res = await api('POST', `/api/community/posts/${postId}/like`);
      showAlert('', res.message, 'success');
    } catch(e) {}
  }

  function toggleWriteForm() {
    const f = document.getElementById('write-form');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  }

  async function submitPost() {
    const title = document.getElementById('post-title').value.trim();
    const content = document.getElementById('post-content').value.trim();
    if (!title || !content) return;
    try {
      await api('POST', '/api/community/posts', { title, content });
      document.getElementById('post-title').value = '';
      document.getElementById('post-content').value = '';
      toggleWriteForm();
      loadPosts();
    } catch(e) {}
  }

  async function submitComment() {
    const content = document.getElementById('comment-input').value.trim();
    if (!content || !currentPostId) return;
    try {
      await api('POST', `/api/community/posts/${currentPostId}/comments`, { content });
      document.getElementById('comment-input').value = '';
      loadPost(currentPostId, '');
    } catch(e) {}
  }

  /* ──────────────────── 초기화 ──────────────────── */
  if (token && currentUser) {
    onLoggedIn();
  }
</script>
</body>
</html>
